<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Second Brain - Obsidian 기반 지식 구조화 대시보드">
    <title>Second Brain 🧠</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <!-- Ambient background -->
    <div class="ambient-bg">
        <div class="ambient-orb orb-1"></div>
        <div class="ambient-orb orb-2"></div>
        <div class="ambient-orb orb-3"></div>
    </div>

    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <span class="logo-icon">🧠</span>
                    <div class="logo-text">
                        <h1>Second Brain</h1>
                        <span class="logo-sub">Knowledge Structuring</span>
                    </div>
                </div>
            </div>

            <div class="sidebar-stats">
                <div class="stat-card">
                    <span class="stat-number" id="stat-total">0</span>
                    <span class="stat-label">총 노트</span>
                </div>
                <div class="stat-card">
                    <span class="stat-number" id="stat-today">0</span>
                    <span class="stat-label">오늘</span>
                </div>
                <div class="stat-card">
                    <span class="stat-number" id="stat-keywords">0</span>
                    <span class="stat-label">키워드</span>
                </div>
            </div>

            <div class="sidebar-section">
                <h3 class="section-title">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                    최근 처리
                </h3>
                <div class="history-list" id="history-list">
                    <div class="history-empty">
                        <span>아직 처리된 자료가 없습니다</span>
                    </div>
                </div>
            </div>

            <div class="sidebar-footer">
                <div class="connection-status" id="connection-status">
                    <span class="status-dot disconnected"></span>
                    <span>연결 중...</span>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Header -->
            <header class="main-header">
                <button class="sidebar-toggle" id="sidebar-toggle" aria-label="Toggle sidebar">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
                </button>
                <div class="header-info">
                    <h2>대시보드</h2>
                    <p class="header-subtitle" id="vault-path">Vault 초기화 중...</p>
                </div>
                <div class="header-actions">
                    <button class="btn btn-ghost" id="btn-refresh" title="새로고침">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 4v6h6M23 20v-6h-6"/><path d="M20.49 9A9 9 0 005.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 013.51 15"/></svg>
                    </button>
                </div>
            </header>

            <!-- Drop Zone -->
            <section class="dropzone-section">
                <div class="dropzone" id="dropzone">
                    <div class="dropzone-content">
                        <div class="dropzone-icon">
                            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                                <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
                                <polyline points="17 8 12 3 7 8"/>
                                <line x1="12" y1="3" x2="12" y2="15"/>
                            </svg>
                        </div>
                        <h3>자료를 드래그하여 놓으세요</h3>
                        <p>PDF, 이미지, Markdown, 텍스트, PPT, DOC 파일을 지원합니다</p>
                        <div class="dropzone-formats">
                            <span class="format-badge">.pdf</span>
                            <span class="format-badge">.docx</span>
                            <span class="format-badge">.pptx</span>
                            <span class="format-badge">.md</span>
                            <span class="format-badge">.txt</span>
                            <span class="format-badge">.png</span>
                            <span class="format-badge">.jpg</span>
                        </div>
                        <button class="btn btn-primary" id="btn-browse">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48"/></svg>
                            파일 선택
                        </button>
                        <input type="file" id="file-input" multiple hidden 
                               accept=".pdf,.docx,.doc,.pptx,.ppt,.png,.jpg,.jpeg,.gif,.bmp,.webp,.md,.txt,.csv">
                    </div>
                    <div class="dropzone-overlay" id="dropzone-overlay">
                        <div class="overlay-content">
                            <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                                <path d="M12 5v14M5 12h14"/>
                            </svg>
                            <span>파일을 놓으세요</span>
                        </div>
                    </div>
                </div>

                <!-- URL Input -->
                <div class="url-input-section">
                    <div class="url-input-wrapper">
                        <svg class="url-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M10 13a5 5 0 007.54.54l3-3a5 5 0 00-7.07-7.07l-1.72 1.71"/>
                            <path d="M14 11a5 5 0 00-7.54-.54l-3 3a5 5 0 007.07 7.07l1.71-1.71"/>
                        </svg>
                        <input type="url" id="url-input" placeholder="웹페이지 URL을 입력하세요..." class="url-input">
                        <button class="btn btn-accent" id="btn-url">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
                            스크래핑
                        </button>
                    </div>
                </div>
            </section>

            <!-- Processing Queue -->
            <section class="queue-section" id="queue-section" style="display: none;">
                <h3 class="section-title">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
                    처리 중
                </h3>
                <div class="queue-list" id="queue-list"></div>
            </section>

            <!-- Results -->
            <section class="results-section" id="results-section" style="display: none;">
                <h3 class="section-title">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
                    생성된 노트
                </h3>
                <div class="results-grid" id="results-grid"></div>
            </section>
        </main>
    </div>

    <!-- Toast Container -->
    <div class="toast-container" id="toast-container"></div>

    <script src="js/dropzone.js"></script>
    <script src="js/dashboard.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
